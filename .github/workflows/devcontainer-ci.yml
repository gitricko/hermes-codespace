name: Dev Container CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Detect what changed (runs in <5 seconds)
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      runtime: ${{ steps.filter.outputs.runtime }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infrastructure:
              - '.devcontainer/post-create-cmd.sh'
              - '.devcontainer/start-hermes.sh'
              - '.devcontainer/self-check.sh'
              - '.devcontainer/devcontainer.json'
              - '.github/workflows/**'
            runtime:
              - '.devcontainer/skills/**'
              - '.devcontainer/wiki/**'
              - '.devcontainer/mnemon/**'
              - '.devcontainer/memories/**'
              - '.devcontainer/.hermes.md'
              - '.devcontainer/codespace-cleanup.sh'
            docs:
              - 'README.md'
              - '*.md'

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Full build + smoke test (only if infrastructure changed)
  # ─────────────────────────────────────────────────────────────────
  full-build:
    name: Build & Smoke Test
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: run post-create-cmd.sh
        run: bash ./.devcontainer/post-create-cmd.sh

      - name: run start-hermes.sh
        run: bash ./.devcontainer/start-hermes.sh

      - name: Smoke Test
        run: |
          bash ./.devcontainer/self-check.sh
          echo "Smoke test passed!"

      - name: Mnemon Integration Test
        run: |
          set -euo pipefail
          TEST_NAME="ci-mnemon-$(date +%s)-$$"
          echo "=== Mnemon Integration Test: $TEST_NAME ==="

          echo "[1/3] Hermes remembers via mnemon_remember..."
          hermes chat -q "my name is $TEST_NAME, remember this in mnemon" \
            || { echo "FAIL: Hermes failed"; exit 1; }

          echo "[2/3] mnemon recall via CLI..."
          mnemon recall "$TEST_NAME" --limit 5 2>&1 | grep -q "$TEST_NAME" \
            || { echo "FAIL: mnemon recall did not find $TEST_NAME"; exit 1; }

          echo "[3/3] Claude retrieves via mnemon..."
          CLAUDE_OUTPUT=$(timeout 60 \
            $HOME/.local/bin/claude --dangerously-skip-permissions -p \
            "Use mnemon recall to find my name. Reply with ONLY the name." 2>&1)
          echo "Claude: $CLAUDE_OUTPUT"
          echo "$CLAUDE_OUTPUT" | grep -q "$TEST_NAME" \
            || { echo "FAIL: Claude did not return $TEST_NAME"; exit 1; }

          echo "=== ALL MNEMON CHECKS PASSED ==="

      # ── Collect logs on failure ──────────────────────────────────────
      - name: Collect diagnostic logs
        if: failure()
        run: |
          mkdir -p /tmp/failure-logs

          # Service logs (written to /tmp by start scripts)
          cp /tmp/modelrelay.log   /tmp/failure-logs/ 2>/dev/null || true
          cp /tmp/omniroute.log    /tmp/failure-logs/ 2>/dev/null || true
          cp /tmp/ollama.log       /tmp/failure-logs/ 2>/dev/null || true
          cp /tmp/ollama-pull.log  /tmp/failure-logs/ 2>/dev/null || true

          # Hermes logs
          cp ~/.hermes/logs/gateway.log   /tmp/failure-logs/ 2>/dev/null || true
          cp ~/.hermes/logs/dashboard.log /tmp/failure-logs/ 2>/dev/null || true

          # System diagnostics
          ps aux > /tmp/failure-logs/ps-aux.txt 2>&1 || true
          ss -tlnp > /tmp/failure-logs/ss-tlnp.txt 2>&1 || netstat -tlnp > /tmp/failure-logs/netstat-tlnp.txt 2>&1 || true

          echo "=== Collected logs ==="
          ls -la /tmp/failure-logs/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: /tmp/failure-logs/
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Lint & validation (for docs + runtime changes)
  # ─────────────────────────────────────────────────────────────────
  lint-check:
    name: Lint & Validate
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.docs == 'true' ||
      needs.detect-changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Create lint config
        run: |
          cat > /tmp/.markdownlint.json << 'LINTCONF'
          {
            "default": true,
            "MD001": false,
            "MD012": false,
            "MD013": false,
            "MD022": false,
            "MD024": { "siblings_only": true },
            "MD026": false,
            "MD031": false,
            "MD032": false,
            "MD033": false,
            "MD036": false,
            "MD040": false,
            "MD041": false,
            "MD047": false,
            "MD058": false,
            "MD060": false
          }
          LINTCONF

      - name: Lint markdown files
        run: |
          echo "=== Linting markdown files ==="
          # Lint wiki articles, skills, and root README
          markdownlint \
            .devcontainer/wiki/*.md \
            .devcontainer/skills/*/SKILL.md \
            .devcontainer/.hermes.md \
            README.md \
            --config /tmp/.markdownlint.json \
            || { echo "Markdown lint failed!"; exit 1; }
          echo "✅ Markdown lint passed"

      - name: Validate SKILL.md files
        run: |
          echo "=== Validating SKILL.md structure ==="
          errors=0
          for skill in .devcontainer/skills/*/SKILL.md; do
            [ -f "$skill" ] || continue
            name=$(basename $(dirname "$skill"))
            # Check YAML frontmatter exists
            if ! head -1 "$skill" | grep -q "^---"; then
              echo "❌ $skill: missing YAML frontmatter (must start with ---)"
              errors=$((errors + 1))
              continue
            fi
            # Check frontmatter closes (look in first 20 lines)
            if ! sed -n '2,20p' "$skill" | grep -q "^---"; then
              echo "❌ $skill: unclosed YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi
            # Check has name field
            if ! sed -n '2,/^---$/p' "$skill" | grep -q "^name:"; then
              echo "❌ $skill: missing 'name' field in frontmatter"
              errors=$((errors + 1))
              continue
            fi
            echo "  ✅ $name"
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors skill(s) failed validation"
            exit 1
          fi
          echo "✅ All skills valid"

      - name: Validate wiki INDEX.md
        run: |
          echo "=== Checking wiki INDEX.md ==="
          # Verify every .md file in wiki/ (except INDEX.md) has an entry in INDEX.md
          errors=0
          for article in .devcontainer/wiki/*.md; do
            basename=$(basename "$article")
            [ "$basename" = "INDEX.md" ] && continue
            if ! grep -q "$basename" .devcontainer/wiki/INDEX.md; then
              echo "❌ $basename not listed in INDEX.md"
              errors=$((errors + 1))
            else
              echo "  ✅ $basename referenced in INDEX.md"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors article(s) missing from INDEX.md"
            exit 1
          fi
          echo "✅ Wiki INDEX.md is consistent"

      - name: Validate Mnemon seed.json
        run: |
          echo "=== Validating Mnemon seed.json ==="
          SEED=".devcontainer/mnemon/seed.json"
          if [ ! -f "$SEED" ]; then
            echo "No seed.json found — skipping"
            exit 0
          fi
          python3 .devcontainer/mnemon/validate-seed.py "$SEED"
          echo "✅ Mnemon seed.json valid"

      - name: Shell script syntax check
        run: |
          echo "=== Checking shell script syntax ==="
          for script in .devcontainer/*.sh; do
            [ -f "$script" ] || continue
            if bash -n "$script" 2>&1; then
              echo "  ✅ $(basename $script)"
            else
              echo "  ❌ $(basename $script): syntax error"
              exit 1
            fi
          done
          echo "✅ All shell scripts valid"

      - name: Validate symlink persistence (memories + skills)
        run: |
          echo "=== Validating symlink persistence contract ==="
          # Static validation that runs on a bare runner (no devcontainer):
          # 1. Tracked targets exist in the repo
          # 2. Boot scripts reference the correct target paths
          REPO_ROOT="$(pwd)"
          MEM_TRACKED="$REPO_ROOT/.devcontainer/memories"
          SKILLS_TRACKED="$REPO_ROOT/.devcontainer/skills"
          FAIL=0

          if [ -d "$MEM_TRACKED" ]; then
            echo "  ✅ Tracked memories dir exists -> $MEM_TRACKED"
          else
            echo "  ❌ Tracked memories dir missing: $MEM_TRACKED"
            FAIL=1
          fi
          if [ -d "$SKILLS_TRACKED" ]; then
            echo "  ✅ Tracked skills dir exists -> $SKILLS_TRACKED"
          else
            echo "  ❌ Tracked skills dir missing: $SKILLS_TRACKED"
            FAIL=1
          fi

          # Boot scripts must symlink the runtime path to the tracked target
          if grep -q "TRACKED_MEMORIES.*HERMES_MEMORIES\|ln -s.*memories" .devcontainer/post-create-cmd.sh; then
            echo "  ✅ post-create-cmd.sh creates memories symlink"
          else
            echo "  ❌ post-create-cmd.sh missing memories symlink"
            FAIL=1
          fi
          if grep -q "SKILLS_TARGET.*SKILLS_SYMLINK\|ln -s.*skills" .devcontainer/start-hermes.sh; then
            echo "  ✅ start-hermes.sh creates skills symlink"
          else
            echo "  ❌ start-hermes.sh missing skills symlink"
            FAIL=1
          fi
          if grep -q "MEMORIES_TRACKED.*MEMORIES_RUNTIME\|ln -s.*memories" .devcontainer/start-hermes.sh; then
            echo "  ✅ start-hermes.sh repair guard covers memories"
          else
            echo "  ❌ start-hermes.sh missing memories repair guard"
            FAIL=1
          fi

          if [ "$FAIL" -eq 0 ]; then
            echo "✅ Symlink persistence contract valid"
          else
            exit 1
          fi
