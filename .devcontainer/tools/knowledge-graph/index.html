<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnemon Knowledge Graph</title>
<!-- __THREE__ -->
<!-- __FORCE_GRAPH__ -->
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330;
    --text: #e6edf3; --muted: #8b949e; --border: #30363d; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow:hidden; }
  #graph-container { position: fixed; inset: 0; }
  #graph-container canvas { display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #labels .nl { position: absolute; transform: translate(-50%,-50%);
    font-size: 12px; font-weight: 700; letter-spacing: .3px; color: #fff;
    padding: 3px 10px; border-radius: 12px; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  #title { position: fixed; top: 14px; left: 16px; z-index: 10; pointer-events: none; }
  #title h1 { margin: 0; font-size: 16px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #title .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  #panel { position: fixed; top: 14px; right: 16px; z-index: 20; width: 238px;
    background: rgba(22,27,34,.94); border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #panel-head { display:flex; align-items:center; justify-content:space-between; padding:9px 12px;
    border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
  #panel-head .pt { font-weight:600; }
  #panel.shrunk #body { display:none; }
  #panel.shrunk #panel-head { border-bottom:none; }
  #body { padding: 12px; }
  .grp-label { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:10px 0 6px; }
  .grp-label:first-child { margin-top:0; }
  .cat { display:flex; align-items:center; gap:7px; padding:3px 4px; border-radius:5px; cursor:pointer; }
  .cat:hover { background: rgba(255,255,255,.04); }
  .cat .swatch { width:12px; height:12px; border-radius:3px; flex:none; }
  .cat.off .lbl { color: var(--muted); text-decoration: line-through; }
  .cat .cnt { margin-left:auto; color:var(--muted); font-size:11px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row input[type=range] { flex:1; accent-color: var(--accent); }
  .row .val { width:30px; text-align:right; color:var(--muted); font-size:12px; }
  .btn { width:100%; padding:6px 10px; margin-top:5px; border:1px solid var(--border);
    background: var(--panel2); color: var(--text); border-radius:6px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color: var(--accent); }
  .sep { height:1px; background: var(--border); margin:10px 0; }
  .hint { font-size:11px; color: var(--muted); line-height:1.5; margin-top:4px; }
  .footer { font-size:10.5px; color: var(--muted); margin-top:10px; text-align:center; padding-top:8px; border-top:1px solid var(--border); }

  #legend { position: fixed; bottom: 14px; left: 16px; z-index: 10; font-size:11px; color:var(--muted);
    padding:8px 12px; background:rgba(22,27,34,.7); border:1px solid var(--border); border-radius:8px; }
  #legend .lg { display:flex; align-items:center; gap:7px; padding:1px 0; }
  #legend .swatch { width:9px; height:9px; border-radius:50%; }
  #controls-hint { position:fixed; bottom:14px; right:16px; z-index:10; font-size:11px; color:var(--muted); text-align:right; line-height:1.6; }

  #tooltip { position: fixed; z-index: 40; max-width: 380px; min-width: 200px;
    background: rgba(13,17,23,.97); border:1px solid var(--border); border-radius:8px;
    padding: 12px 14px; font-size: 12px; line-height: 1.55; pointer-events: none; opacity: 0;
    transition: opacity .12s; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-cat { display:inline-block; font-size:10px; padding:1px 8px; border-radius:10px;
    margin-bottom:6px; color:#fff; font-weight:600; letter-spacing:.3px; }
  #tooltip .tt-title { font-weight:600; margin-bottom:4px; }
  #tooltip .tt-body { color:#c9d1d9; }
  #tooltip .tt-meta { margin-top:8px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); padding-top:6px; }
</style>
</head>
<body>
  <div id="graph-container"></div>
  <div id="labels"></div>

  <div id="title">
    <h1>&#129504; Mnemon Knowledge Graph</h1>
    <div class="sub" id="subtitle">loading&hellip;</div>
  </div>

  <div id="panel">
    <div id="panel-head"><span class="pt">Filters</span><span class="hint" style="margin:0">&#9660;</span></div>
    <div id="body">
      <div class="grp-label">Categories &mdash; click to hide</div>
      <div id="catlist"></div>

      <div class="grp-label">Min importance</div>
      <div class="row">
        <input type="range" id="imp" min="1" max="5" step="1" value="1">
        <span class="val" id="impval">1</span>
      </div>

      <div class="sep"></div>
      <button class="btn" id="toggleSpin">&#9208; Pause auto-rotate</button>
      <button class="btn" id="resetView">&#8635; Reset view</button>

      <div class="sep"></div>
      <div class="hint">Drag = rotate &middot; scroll = zoom &middot; right-drag = pan<br>click a node for details</div>
      <div class="footer" id="stats"></div>
    </div>
  </div>

  <div id="legend">
    <div class="lg"><span class="swatch" style="background:#58a6ff"></span>decision</div>
    <div class="lg"><span class="swatch" style="background:#3fb950"></span>context</div>
    <div class="lg"><span class="swatch" style="background:#d29922"></span>fact</div>
    <div class="lg"><span class="swatch" style="background:#a371f7"></span>insight</div>
    <div class="lg"><span class="swatch" style="background:#8b949e"></span>general</div>
  </div>

  <div id="controls-hint">&#8645; drag &middot; &#10022; scroll &middot; right-drag pan</div>

  <div id="tooltip"></div>

  <script>
  /* ====== INJECTED DATA ====== */
  var DATA = null;
  /* __DATA__ */

  var CAT_COLOR = { decision:'#58a6ff', context:'#3fb950', fact:'#d29922',
    insight:'#a371f7', general:'#8b949e', other:'#8b949e' };
  var CAT_ORDER = ['decision','context','fact','insight','general'];

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function effToVal(eff){ var t=Math.max(0,Math.min(1,(eff||0.5)/3)); return 3 + t*16; }

  /* ---------- state ---------- */
  var container = document.getElementById('graph-container');
  var labelsBox = document.getElementById('labels');
  var impSlider = document.getElementById('imp');
  var Graph = null;
  var hidden = {};         /* category -> true when hidden */
  var spin = true;
  var impMin = parseInt(impSlider.value, 10) || 1;

  /* ---------- tooltip ---------- */
  var lastMouse = {x:24, y:24};
  window.addEventListener('mousemove',function(e){ lastMouse.x=e.clientX; lastMouse.y=e.clientY; });
  function showTooltip(n){
    var t=document.getElementById('tooltip');
    var tags=(n.tags&&n.tags.length)?n.tags.map(function(x){return '#'+x;}).join(' '):'';
    var ents=(n.entities&&n.entities.length)?n.entities.join(', '):'';
    t.innerHTML =
      '<div class="tt-cat" style="background:'+(CAT_COLOR[n.category]||CAT_COLOR.other)+'">'+esc(n.category)+'</div>'+
      '<div class="tt-title">'+esc(n.label)+'</div>'+
      '<div class="tt-body">'+esc(n.content)+'</div>'+
      '<div class="tt-meta">'+
        (n.importance?'importance <b>'+n.importance+'</b>':'')+
        (ents?'<br>entities: '+esc(ents):'')+
        (tags?'<br>tags: '+esc(tags):'')+
        '<br>created '+esc(n.created||'')+'</div>';
    t.classList.add('show');
    t.style.left = Math.min(lastMouse.x+16, window.innerWidth-400)+'px';
    t.style.top  = (lastMouse.y-10)+'px';
  }
  function hideTooltip(){ document.getElementById('tooltip').classList.remove('show'); }

  /* ---------- frame the node cluster in view ---------- */
  function frameGraph(){
    if (!Graph) return;
    try {
      var bb = Graph.getGraphBbox();
      if (!bb || !bb.x) return;
      var cx = (bb.x[0]+bb.x[1])/2, cy=(bb.y[0]+bb.y[1])/2, cz=(bb.z[0]+bb.z[1])/2;
      var span = Math.max(bb.x[1]-bb.x[0], bb.y[1]-bb.y[0], bb.z[1]-bb.z[0]) || 1;
      // perspective camera; vertical fov ~52deg. distance so span fills ~62% of view height.
      var dist = (span/(2*Math.tan((57/2)*Math.PI/180)))/0.72;
      var ang = Math.PI*0.24;
      Graph.cameraPosition(
        { x: cx + Math.sin(ang)*dist, y: cy + Math.cos(ang)*dist, z: cz + dist*0.4 },
        { x: cx, y: cy, z: cz }, 600);
    } catch(e){ /* ignore framing failure; controls still work */ }
  }

  /* ---------- category pills overlaid on the bubbles ---------- */
  /* HTML overlay avoids the bundled three r183 being mixed with any other
     three copy (which crashes with 'Multiple instances of Three.js'). */
  var labelEls = {};   /* id -> div */
  function syncLabels(){
    if(!Graph) return;
    var nodes=Graph.graphData().nodes;
    nodes.forEach(function(n){
      var el=labelEls[n.id];
      if(!el){
        el=document.createElement('div'); el.className='nl';
        el.textContent=(n.category||'').toUpperCase();
        el.style.background=(CAT_COLOR[n.category]||CAT_COLOR.other);
        labelsBox.appendChild(el); labelEls[n.id]=el;
      }
      if(!nodeVisible(n)){ el.style.display='none'; return; }
      var p=Graph.graph2ScreenCoords(n.x||0, n.y||0, n.z||0);
      if(p && isFinite(p.x) && isFinite(p.y)){
        el.style.display='block';
        el.style.left=p.x+'px'; el.style.top=p.y+'px';
      } else { el.style.display='none'; }
    });
  }
  function labelLoop(){ spinCam(); syncLabels(); requestAnimationFrame(labelLoop); }

  /* ---------- auto-rotate (manual, since the bundle lacks .autoRotate) ---------- */
  var spinAngle = 0;
  function spinCam(){
    if(!Graph || !spin) return;
    spinAngle += 0.0035;                 // gentle: ~2 deg/frame at 60fps ≈ 12s per lap
    var cam = Graph.camera();
    if(!cam) return;
    var p = cam.position;
    var dist = Math.sqrt(p.x*p.x + p.z*p.z) || 180;  // keep current radius
    var y = p.y;                                       // keep current height
    cam.position.set(Math.sin(spinAngle)*dist, y, Math.cos(spinAngle)*dist);
    cam.lookAt(0, 0, 0);
  }

  /* ---------- node/link filtering ---------- */
  function nodeVisible(n){
    if(hidden[n.category]) return false;
    return (n.importance||0)>=impMin;
  }
  function applyVisibility(){
    if(!Graph) return;
    Graph.nodeVisibility(nodeVisible)
         .linkVisibility(function(l){
           var s=Graph.graphData().nodes.find(function(x){return x.id===l.source;});
           var t=Graph.graphData().nodes.find(function(x){return x.id===l.target;});
           return s&&t&&nodeVisible(s)&&nodeVisible(t);
         });
  }

  /* ---------- build the graph ---------- */
  function build(){
    var nodes = DATA.nodes.map(function(n){
      return { id:n.id,label:n.label,category:n.category,content:n.content,
        tags:n.tags||[],entities:n.entities||[],source:n.source,created:n.created,
        importance:n.importance,eff:n.eff,val:effToVal(n.eff),
        color:CAT_COLOR[n.category]||CAT_COLOR.other };
    });
    var links = DATA.edges.map(function(e){ return {source:e.source,target:e.target,type:e.type,weight:e.weight||1}; });

    Graph = ForceGraph3D();
    Graph(container)
          .graphData({nodes:nodes,links:links})
          .nodeRelSize(12).nodeVal('val').nodeLabel(function(n){return n.label;})
          .nodeColor('color').nodeOpacity(0.95).nodeResolution(20)
          .linkColor(function(){ return 'rgba(120,132,146,0.85)'; })
          .linkWidth(function(l){ var w=l.weight||1; return Math.max(0.6,Math.min(4,w*0.9)); })
          .linkOpacity(0.55)
          .backgroundColor('#0d1117')
          .cooldownTicks(600).cooldownTime(12000)
          .onEngineTick(function(){ /* nudge runs during cooldown */ })
          .onEngineStop(function(){ frameGraph(); fillStats(); })
          .onNodeHover(function(h){ h?showTooltip(h):hideTooltip(); })
          .onNodeClick(function(n){
            Graph.cameraPosition({ x:n.x+(n.x||0)*0.9, y:n.y, z:n.z+90 || 90 }, n, 600);
            showTooltip(n);
          })
          .onNodeDragEnd(function(n){ n.fx=n.x; n.fy=n.y; n.fz=n.z; })
          // Start with a tighter initial camera than the default so it's never
          // impossibly far from the nodes before the simulation settles.
          // (Auto-spin is handled manually in the rAF loop below — this bundle
          //  does not expose .autoRotate().)
          .cameraPosition({x:-120, y:-60, z:180}, {x:0,y:0,z:0}, 0);

    applyVisibility();
    fillStats();
    buildCatList();
    labelLoop();   // overlay category pills, updates every frame
  }

  /* ---------- category toggles ---------- */
  function buildCatList(){
    var list=document.getElementById('catlist');
    var counts={}; DATA.nodes.forEach(function(n){ counts[n.category]=(counts[n.category]||0)+1; });
    list.innerHTML='';
    // un-hide-all control
    var both=document.createElement('div');
    both.className='cat';
    both.innerHTML='<span class="swatch" style="background:#fff"></span><span class="lbl">show all</span>';
    both.addEventListener('click',function(){ hideAll(false); });
    list.appendChild(both);
    CAT_ORDER.forEach(function(cat){
      var row=document.createElement('div'); row.className='cat';
      row.innerHTML='<span class="swatch" style="background:'+CAT_COLOR[cat]+'"></span>'
        +'<span class="lbl">'+cat+'</span>'
        +'<span class="cnt">'+(counts[cat]||0)+'</span>';
      row.addEventListener('click',function(){
        hidden[cat]=!hidden[cat];
        if(hidden[cat]) row.classList.add('off'); else row.classList.remove('off');
        applyVisibility();
      });
      list.appendChild(row);
    });
  }
  function hideAll(v){ hidden={}; document.querySelectorAll('#catlist .cat').forEach(function(r){r.classList.remove('off');}); applyVisibility(); }

  /* ---------- stats ---------- */
  function fillStats(){
    var m=DATA.meta||{};
    document.getElementById('subtitle').textContent=m.node_count+' memories, '+m.edge_count+' connections';
    document.getElementById('stats').textContent=m.node_count+' nodes · '+m.edge_count+' edges';
  }

  /* ---------- controls ---------- */
  impSlider.addEventListener('input',function(e){
    impMin=parseInt(e.target.value,10)||1;
    document.getElementById('impval').textContent=e.target.value; applyVisibility();
  });
  document.getElementById('toggleSpin').addEventListener('click',function(e){
    spin=!spin; e.target.textContent=spin ? '\u23f8 Pause auto-rotate' : '\u25b6 Resume auto-rotate';
  });
  document.getElementById('resetView').addEventListener('click',function(){
    if(!Graph) return;
    Graph.cameraPosition({x:0,y:0,z:300},null,800);
  });
  document.getElementById('panel-head').addEventListener('click',function(){
    document.getElementById('panel').classList.toggle('shrunk');
  });

  /* ---------- init ---------- */
  window.addEventListener('load',function(){
    if(!DATA){ document.getElementById('subtitle').textContent='graph.json missing'; return; }
    build();
  });
  </script>
</body>
</html>
