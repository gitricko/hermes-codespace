{id:"3cb25287-85db-4737-8ea6-f407ef48d864",label:"3cb25287: [context] Fixed. The graph now renders clearly.  ## Root cause  The gr...",title:"Fixed. The graph now renders clearly.\\n\\n## Root cause\\n\\nThe graph was never actually blank — my pixel analysis proved the 25 nodes/372 edges were being drawn. The problem was **camera framing**: 3d-force-graph's default camera sits ~1000 units out while your node cluster only spans ~200 units. After the physics simulation settled, nothing re-framed the camera, so the entire graph shrank to a tiny far-away smudge on a dark background — reading as \"empty.\" On top of that, the edges were double-faded (`rgba(...,0.30)` color × `linkOpacity:0.3`), making the structure nearly invisible.\\n\\n## What I fix",color:"#f39c12",font:{color:"white"}},
{id:"88d849b7-b691-463f-823c-57c9f8fb8943",label:"88d849b7: [general] Stopped.  Quick status so you know where things stand:  - Th...",title:"Stopped.\\n\\nQuick status so you know where things stand:\\n\\n- The 3D viewer HTML exists and serves fine (HTTP 200), but you're right — the graph area renders blank; my screenshot pixel analysis showed only the UI chrome (panel, title, legend) and near-zero graph pixels. So something in the render path is genuinely broken, not just a vision-model artifact.\\n- The local server on port 8123 is still running in the background (session `proc_0bb4cf1c187d`) — say the word if you want it killed.\\n\\nI haven't changed anything else. Tell me how you want to proceed — happy to dig into the blank-render bug, or pivot (e.g., fall back to the built-in `mnemon viz` 2D output as a quick stopgap).",color:"#95a5a6",font:{color:"white"}},

{id:"ac315679-7ac9-4861-ba29-d2931713a3da",label:"ac315679: [general] Here's your proposal. Quick note first: your Mnemon graph is...",title:"Here's your proposal. Quick note first: your Mnemon graph is currently small — **23 live insights, 308 edges**. So this is entirely feasible and will look clean, not a hairball.\\n\\n## What the data looks like (verified from the DB)\\n\\nTwo tables power the whole thing:\\n\\n- **insights** — one memory node. Fields worth visualizing: `category` (context/decision/fact/insight/general), `importance` (1–5), `effective_importance` (0–1, boosted by use), `tags`, `entities`, `created_at`.\\n- **edges** — directed links between insights, typed:\\n  - `temporal` (born around the same time)\\n  - `semantic` (similar content)\\n  - `causal` (one drove another)\\n  - `entity` (share a named entity, e.g. `start-hermes.sh`)\\n\\nBonus: Mnemon ships a built-in `mnemon viz --format html` that already emits a vis.js page. So we're not building from scratch — the question is whether to **use it as-is, or build a richer custom one**.\\n\\n## Option A — Use the built-in `mnemon viz` (fastest, ~1 command)\\n\\n`mnemon viz --format html -o graph.html` → drops a self-contained vis.js HTML file.\\n\\n- Pros: zero code, includes node/edge data + physics layout out of the box.\\n- Cons: vanillas (default vis controls, no category coloring by default, no importance sizing by default). You get a graph, but it won't tell your story on its own.\\n\\n## Option B — Custom single-file HTML app (my recommendation)\\n\\nOne hand-written `graph.html` (+, Three.js) fed by a tiny export step. This is the \"very nice 3D visualization\" version.\\n\\n**Export step:** I'd query the DB directly (it's plain SQLite — schema confirmed above) and emit a JSON of `{nodes, edges}`. ~15 lines of Python. No extra daemon needed.\\n\\n**Visualization (tools choice):**\\n- **3D XR** — `vis-network` is 2D; the built-in is 2D. For actual **3D** the clean options are **Three.js + ForceGraph3D** (react-force-graph-style), which gives the classic spinning 3D knowledge-graph sphere, or **Cytoscape.js** (2D, lightweight), or **G6**. I'd pick **Three.js/3d-force-graph** — it's exactly built for this and needs no build step if I self-host one file.\\n\\n**How I'd enrich it so it actually narrates your memory:**\\n- **Node size** → `effective_importance` (bigger = more important/more recalled)\\n- **Node color** → `category` (decision/context/fact/insight/general, with legend)\\n- **Node label** → shorttext + category; title tooltip shows full memory + tags + created date\\n- **Edge color + thickness** → `edge_type` + `weight`\\n- **Toggle panel**: show/hide by category, filter by entity, slider for importance threshold\\n- **3D controls**: orbit/zoom, node dragging, auto-spin toggle\\n- Dark theme, self-contained (single HTML — open with a double-click, no server needed)\\n\\n## Recommendation\\n\\nGo **Option B** — it's one self-contained HTML file over a ~15-line SQLite export, and it turns your graph from \"nodes and lines\" into something you can actually *read* (importance, categories, clusters around `start-hermes.sh`, `CI`, `symlink`, etc.). Built-in `viz` is the fallback if you want the quick 2-second version first.\\n\\nDeliverable: one HTML file (standalone), plus the tiny Python exporter, so you can re-generate any time your graph grows.\\n\\nTwo questions before I build:\\n\\n1. **2D or true 3D?** The built-in is 2D. You said \"3DJS\" — do you want the full Three.js rotating-3D graph, or a refined 2D interactive one?\\n2. **Where should it live?** In the repo (so it's versioned and CI-friendly) or just scratch in `~/`?\\n\\nOnce you confirm, I'll build and open it for you.",color:"#95a5a6",font:{color:"white"}},
{id:"12a08e3c-ff30-4ff7-b5a8-cd2a3af594e3",label:"12a08e3c: [general] Doing well, thanks — ready to work whenever you are.  Look...",title:"Doing well, thanks — ready to work whenever you are.\\n\\nLooks like we've got a good foundation of context already: hermes-codespace CI path-filtering, the boot script decision (start-hermes.sh over post-create-cmd.sh), the persistence symlink self-checks, and the wiki/skill sync conventions.\\n\\nWhat are we picking up today?",color:"#95a5a6",font:{color:"white"}},
{id:"79511da9-afb4-447a-a45a-9092454adf2e",label:"79511da9: [context] Skill: codespace-persistent-symlinks — Procedural skill fo...",title:"Skill: codespace-persistent-symlinks — Procedural skill for persisting Hermes state (memories + skills) across Codespace rebuilds via whole-folder symlinks. Documents Option A placement, self-check verification, 3-case guard logic, pitfalls (seed block removal, head truncation bug, verification cases). Symlink pattern mirrors skills: ~/.hermes/memories → .devcontainer/memories/, ~/.hermes/skills/codespace → .devcontainer/skills/. Read .devcontainer/skills/codespace-persistent-symlinks/SKILL.md for full procedure.",color:"#f39c12",font:{color:"white"}},
{id:"be4e5f46-b20c-41fe-b8ef-26896b4f2df4",label:"be4e5f46: [decision] CI path-filter for persistence: .devcontainer/memories/** an...",title:"CI path-filter for persistence: .devcontainer/memories/** and .devcontainer/skills/** are in runtime (not infrastructure) so content changes trigger 30s lint-check, not 15min full-build. lint-check now includes 'Validate symlink persistence' step asserting both symlinks. infrastructure remains boot scripts only (post-create-cmd.sh, start-hermes.sh, self-check.sh, devcontainer.json, workflows). This keeps CI fast for content edits while still gating symlink correctness.",color:"#e74c3c",font:{color:"white"}},
{id:"f287d91e-dc5b-400c-b8b4-7334413df9ba",label:"f287d91e: [context] Wiki: persistent-memory-proposal.md — Architecture decisio...",title:"Wiki: persistent-memory-proposal.md — Architecture decision document for Hermes persistent memory (MEMORY.md/USER.md) versioning via whole-folder symlink. Covers Option A split (post-create authoritative + start-hermes guard), self-check validation, CI wiring, .gitignore for lock/log files, Mnemon primary rule in USER.md. Read .devcontainer/wiki/persistent-memory-proposal.md for full details.",color:"#f39c12",font:{color:"white"}},
{id:"c4524cd0-663d-43cf-9530-30119ea1ce51",label:"c4524cd0: [decision] Persistent Memory Option A (validated 2026-08): post-create-...",title:"Persistent Memory Option A (validated 2026-08): post-create-cmd.sh is authoritative for symlink creation (runs once on fresh container, right after Hermes install, before Hermes instantiates ~/.hermes/memories). start-hermes.sh keeps only a slim repair guard (~12 lines) for pre-existing containers where postCreateCommand doesn't re-run. Symlink: ~/.hermes/memories → .devcontainer/memories/ (whole folder, skills pattern). .gitignore in tracked dir ignores *.lock *.log. Mnemon primary rule preserved in tracked USER.md.",color:"#e74c3c",font:{color:"white"}},
{id:"b30bacd3-181d-44c4-a215-7235fb86c041",label:"b30bacd3: [decision] Self-check.sh Persistence section (section 9) validates both...",title:"Self-check.sh Persistence section (section 9) validates both memories and skills symlinks: 9a) ~/.hermes/memories → .devcontainer/memories, 9b) ~/.hermes/skills/codespace → .devcontainer/skills. Each handles 3 cases: correct symlink (ok), real dir (fail), missing (fail). 9c (tracked content existence) removed as redundant with git checkout. CI lint-check also validates symlinks via standalone step for runtime changes.",color:"#e74c3c",font:{color:"white"}},
{id:"40a6abb6-27e7-492c-bcac-9b4b6f311568",label:"40a6abb6: [decision] Refactored start-hermes.sh with unified dependency validatio...",title:"Refactored start-hermes.sh with unified dependency validation: single loop checks 5 binaries (modelrelay, omniroute, ollama, hermes, mnemon) + skills directory + seed.json. Fails fast with FATAL message listing all missing items. Simplified service sections to use pgrep only.",color:"#e74c3c",font:{color:"white"}},
{id:"3160d374-fd50-4303-9ba5-92571771baba",label:"3160d374: [insight] github-pr-review skill: 5-step workflow for evaluating GitHu...",title:"github-pr-review skill: 5-step workflow for evaluating GitHub CodeQL and Copilot suggestions on PRs. Fetch comments, triage by source, evaluate (ACCEPT/REJECT/DEFER), present proposal as table, implement after approval. Decision framework: always accept security findings, reject false positives, defer architectural changes.",color:"#9b59b6",font:{color:"white"}},
{id:"639db94d-8db7-48b8-bb3a-000cd9eac174",label:"639db94d: [decision] Keepalive implementation: keepalive.sh service started by st...",title:"Keepalive implementation: keepalive.sh service started by start-hermes.sh to prevent idle shutdown. Contains A+B approach: (A) periodic terminal heartbeat on hermes's pty to mimic user activity (GitHub platform idle detection), (B) internal pinger hitting VS Code server /delay-shutdown endpoint to reset server-side shutdown timer (5-min grace). Testable with --test flag. Wires into container lifecycle, idempotent, survives start/rebuild.",color:"#e74c3c",font:{color:"white"}},
{id:"4a1b335f-99f9-46a8-b49e-ec8c7c605917",label:"4a1b335f: [decision] Wiki naming convention: Use 'wiki' (not 'knowledge' or 'KNOW...",title:"Wiki naming convention: Use 'wiki' (not 'knowledge' or 'KNOWLEDGE.md'). Follows LM Wiki / Karpathy concept of interlinked markdown articles. .hermes.md instructs agent to read from .devcontainer/wiki/. INDEX.md serves as table of contents.",color:"#e74c3c",font:{color:"white"}},
{id:"af81142e-926f-4ad2-b98d-3272233fbbbc",label:"af81142e: [decision] Knowledge capture workflow: Both proactive AND user-triggere...",title:"Knowledge capture workflow: Both proactive AND user-triggered. Agent proposes entries for seed.json (importance \u003e= 4 or new wiki/skill). User reviews via git diff, approves/rejects, commits when ready. Same pattern as skills: agent proposes, user reviews, git persists.",color:"#e74c3c",font:{color:"white"}},
{id:"c7fea99e-fa8a-44a9-83b8-26edc2ca71bb",label:"c7fea99e: [decision] HARD RULE: Before merging ANY PR, always check GitHub CodeQL...",title:"HARD RULE: Before merging ANY PR, always check GitHub CodeQL and Copilot review suggestions (if available). Use the github-pr-review skill to fetch, triage, and evaluate comments. Present findings to user for approval before merging. This is a merge gate — do not skip.",color:"#e74c3c",font:{color:"white"}},
{id:"0cf992d1-aa17-4f8c-a193-5d846cf793fe",label:"0cf992d1: [fact] Mnemon seed import in start-hermes.sh uses dry-run validatio...",title:"Mnemon seed import in start-hermes.sh uses dry-run validation first, then real import. Output parsing must use 'imported' field (not 'added') — the mnemon import JSON returns {imported, skipped, updated, errors}. Fixed grep pattern to match actual output format.",color:"#3498db",font:{color:"white"}},
{id:"ac210555-89e1-4d2d-97f1-b2b5c09ac1e7",label:"ac210555: [fact] Mnemon is the persistent memory system for Hermes. CLI: mnem...",title:"Mnemon is the persistent memory system for Hermes. CLI: mnemon remember/recall/search/import. Database at ~/.mnemon/data/default/mnemon.db. Import format: JSON with schema_version '1' and insights array. Deduplication built-in. Categories: preference, decision, insight, fact, context. Importance: 1-5.",color:"#3498db",font:{color:"white"}},
{id:"0d80f298-aef5-4088-8aa4-f7458b9a5ae0",label:"0d80f298: [insight] CI Fix: Silent failures from npm ci. When npm ci fails, it k...",title:"CI Fix: Silent failures from npm ci. When npm ci fails, it kills the process before writing error output. Fix: pre-build web UI in post-create-cmd.sh using 'npm ci CI=1 --include=dev --workspace web' with explicit error handling and fallback to 'npm install'. See .devcontainer/post-create-cmd.sh for the pattern.",color:"#9b59b6",font:{color:"white"}},
{id:"fcd81f28-6b8f-4b07-bce0-df788483d439",label:"fcd81f28: [insight] CI Debugging lesson: Fix root cause, never weaken the test. ...",title:"CI Debugging lesson: Fix root cause, never weaken the test. Silent failures are hardest — when a process is killed before writing output, you get zero error info. Always compare passing vs failing commits to find the real cause. Self-check.sh CRITICAL_SERVICES variable is defined but unused — all services are always critical.",color:"#9b59b6",font:{color:"white"}},
{id:"d34f8149-7c3f-428e-bacc-96dc939d0339",label:"d34f8149: [fact] Hermes discovers skills via os.walk(followlinks=True) with ~...",title:"Hermes discovers skills via os.walk(followlinks=True) with ~30s cache TTL. New skills written to ~/.hermes/skills/codespace/ (symlinked to .devcontainer/skills/) are auto-discovered within ~30 seconds. No restart needed. Skill format: SKILL.md with YAML frontmatter (name, description, version).",color:"#3498db",font:{color:"white"}},
{id:"9d618ca2-f888-4100-b22e-cf2e34a9bc91",label:"9d618ca2: [decision] Boot script location: start-hermes.sh (NOT post-create-cmd.s...",title:"Boot script location: start-hermes.sh (NOT post-create-cmd.sh). start-hermes.sh runs on every Codespace start/rebuild, making it the reliable place for idempotent setup like symlink creation and Mnemon seeding. post-create-cmd.sh only runs on first create.",color:"#e74c3c",font:{color:"white"}},
{id:"bdf440c6-a31d-40b6-a24d-2329a5202cdf",label:"bdf440c6: [fact] Path-filtered CI: devcontainer-ci.yml uses dorny/paths-filte...",title:"Path-filtered CI: devcontainer-ci.yml uses dorny/paths-filter@v3 with three jobs. detect-changes classifies files into infrastructure/runtime/docs. full-build runs only for infrastructure changes (~15min). lint-check runs for docs/runtime changes (~30s). Concurrency group cancels in-progress runs.",color:"#3498db",font:{color:"white"}},
{id:"e136eb89-2c05-4ee7-9209-4806c1e37588",label:"e136eb89: [context] Wiki: github-actions-testing-plan.md — Phased CI/CD testin...",title:"Wiki: github-actions-testing-plan.md — Phased CI/CD testing plan for hermes-codespace. Covers path-filtered CI with dorny/paths-filter@v3, lint checks (markdownlint, SKILL.md validation, shell syntax), full build with pre-build and smoke test. Read .devcontainer/wiki/github-actions-testing-plan.md for full details.",color:"#f39c12",font:{color:"white"}},
{id:"ca0e5d5f-1c19-4fcb-ae31-10a363f2e3cf",label:"ca0e5d5f: [fact] GITHUB_TOKEN extraction: The real GITHUB_TOKEN is in the VS ...",title:"GITHUB_TOKEN extraction: The real GITHUB_TOKEN is in the VS Code server's process environment at /proc/\u003cPID\u003e/environ, NOT in the shell env. GITHUB_CODESPACE_TOKEN in shell is useless for API calls. GH_TOKEN is set to an invalid value. See .devcontainer/wiki/codespace-playbook.md section 2 for details.",color:"#3498db",font:{color:"white"}},
